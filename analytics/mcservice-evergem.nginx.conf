server {

    server_name mcservice-evergem.be www.mcservice-evergem.be;

    root /var/www/mcservice-evergem.be;
    index index.html;

    location /api/analytics/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_pass_request_headers on;
        client_max_body_size 2k;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mcservice-evergem.be/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mcservice-evergem.be/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.mcservice-evergem.be) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mcservice-evergem.be) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name mcservice-evergem.be www.mcservice-evergem.be;
    return 404; # managed by Certbot




}
